kind: pipeline
type: docker
name: zerox-ci

steps:
  - name: backend-lint-and-tests
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    environment:
      PYTHONPATH: .
    commands:
      - cd backend
      # The lock file pins the versions, so the gate means the same thing on
      # every run.
      - uv sync --frozen --extra dev
      - uv run ruff check app/ alembic/
      - bash ../scripts/arch-guard.sh
      - uv run pytest tests/ -q

  - name: frontend-type-check-and-test
    image: node:20-alpine
    commands:
      - cd frontend
      - npm ci
      - npx tsc --noEmit
      - npm test

  - name: desktop-type-check-lint-and-test
    image: node:20-alpine
    commands:
      - cd desktop
      - npm ci
      - npm run typecheck
      - npm run lint
      - npm test
